name: CI pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'proxy/**'
      - '.github/workflows/ci.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check the repository
        uses: actions/checkout@v6

      - name: Install requirements
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests with verbose flags
        run: pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMG_BASE: ghcr.io/${{ github.repository_owner }}/task-manager
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Check the repository
        uses: actions/checkout@v6
      
      - name: Detect version 
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "app_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "app_version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all images
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            docker build -t ${IMG_BASE}-backend:latest -t ${IMG_BASE}-backend:${GITHUB_SHA::7} -t ${IMG_BASE}-backend:${VERSION} ./backend
            docker build -t ${IMG_BASE}-frontend:latest -t ${IMG_BASE}-frontend:${GITHUB_SHA::7} -t ${IMG_BASE}-frontend:${VERSION} ./frontend
            docker build -t ${IMG_BASE}-proxy:latest -t ${IMG_BASE}-proxy:${GITHUB_SHA::7} -t ${IMG_BASE}-proxy:${VERSION} ./proxy
          else
            docker build -t ${IMG_BASE}-backend:latest -t ${IMG_BASE}-backend:${GITHUB_SHA::7} ./backend
            docker build -t ${IMG_BASE}-frontend:latest -t ${IMG_BASE}-frontend:${GITHUB_SHA::7} ./frontend
            docker build -t ${IMG_BASE}-proxy:latest -t ${IMG_BASE}-proxy:${GITHUB_SHA::7} ./proxy
          fi

      - name: Smoke tests
        run: |
          docker network create test-net

          docker run -d --name test-db --network test-net \
              -e POSTGRES_USER=test \
              -e POSTGRES_PASSWORD=test \
              -e POSTGRES_DB=test \
              postgres:14-alpine

          echo "Waiting for DB..."
          sleep 2

          AVAILABLE=false
          for i in {1..10}; do
              if docker exec test-db pg_isready -U test; then
                  AVAILABLE=true
                  break
              fi
              sleep 2
          done

          if [ "$AVAILABLE" != true ]; then
              echo "DB is not ready"
              exit 1
          fi

          echo "DB is ready"

          docker run -d --name backend --network test-net \
              -e DATABASE_URL=postgresql://test:test@test-db:5432/test \
              -p 8000:8000 \
              ${IMG_BASE}-backend:latest

          echo "Waiting for backend..."

          for i in {1..10}; do
              if curl --fail http://localhost:8000/health; then
                  echo "Service is up"
                  exit 0
              fi

              sleep 2
          done

          echo "Backend did not start in time"
          exit 1

      - name: Smoke tests cleanup
        if: always()
        run: |
          docker rm -f backend test-db || true
          docker network rm test-net || true

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            docker push ${IMG_BASE}-backend:latest
            docker push ${IMG_BASE}-backend:${GITHUB_SHA::7}
            docker push ${IMG_BASE}-backend:${VERSION}
            docker push ${IMG_BASE}-frontend:latest
            docker push ${IMG_BASE}-frontend:${GITHUB_SHA::7}
            docker push ${IMG_BASE}-frontend:${VERSION}
            docker push ${IMG_BASE}-proxy:latest
            docker push ${IMG_BASE}-proxy:${GITHUB_SHA::7}
            docker push ${IMG_BASE}-proxy:${VERSION}
          else
            docker push ${IMG_BASE}-backend:latest
            docker push ${IMG_BASE}-backend:${GITHUB_SHA::7}
            docker push ${IMG_BASE}-frontend:latest
            docker push ${IMG_BASE}-frontend:${GITHUB_SHA::7}
            docker push ${IMG_BASE}-proxy:latest
            docker push ${IMG_BASE}-proxy:${GITHUB_SHA::7}
          fi
  
  trigger-deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Trigger CD workflow and send SHA 
        run: |
          VERSION="${{ needs.build-and-push.outputs.app_version }}"
          curl -X POST \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kacper-przybyla/task-manager-deployment/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"sha\":\"$VERSION\"}}"

  notify:
    runs-on: ubuntu-latest
    needs: [test, build-and-push, trigger-deploy]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Print notify message
        run: |
          echo "Pipeline failed at"
          echo "Github repo - ${{ github.repository }}"
          echo "Github event - ${{ github.event_name }}"
          echo "Commit - ${{ github.sha }}"
          echo "With commit message - ${{ github.event.head_commit.message }}"